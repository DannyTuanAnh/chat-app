version: "3.8"
name: e2ee-messaging-app

services:
  auth-service:
    image: postgres:18.2-alpine3.23
    container_name: auth-service-chat-app
    restart: unless-stopped

    environment:
      POSTGRES_DB: auth-service-chat-app
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres-data-auth-service-chat-app:/var/lib/postgresql/data

  user-service:
    image: postgres:18.2-alpine3.23
    container_name: user-service-chat-app
    restart: unless-stopped

    environment:
      POSTGRES_DB: user-service-chat-app
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}

    ports:
      - "5434:5432"

    volumes:
      - postgres-data-user-service-chat-app:/var/lib/postgresql/data

  friend-service:
    image: postgres:18.2-alpine3.23
    container_name: friend-service-chat-app
    restart: unless-stopped

    environment:
      POSTGRES_DB: friend-service-chat-app
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${FRIEND_DB_PASSWORD}

    ports:
      - "5435:5432"

    volumes:
      - postgres-data-friend-service-chat-app:/var/lib/postgresql/data

  chat-service:
    image: postgres:18.2-alpine3.23
    container_name: chat-service-chat-app
    restart: unless-stopped

    environment:
      POSTGRES_DB: chat-service-chat-app
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${CHAT_DB_PASSWORD}

    ports:
      - "5436:5432"

    volumes:
      - postgres-data-chat-service-chat-app:/var/lib/postgresql/data

  notify-service:
    image: postgres:18.2-alpine3.23
    container_name: notify-service-chat-app
    restart: unless-stopped

    environment:
      POSTGRES_DB: notify-service-chat-app
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${NOTIFY_DB_PASSWORD}

    ports:
      - "5437:5432"

    volumes:
      - postgres-data-notify-service-chat-app:/var/lib/postgresql/data

  redis:
    image: redis:8.6.2-alpine
    container_name: redis-chat-app
    restart: unless-stopped
    ports:
      - "6380:6379"
    command:
      [
        "redis-server",
        "--save",
        "900",
        "1",
        "--save",
        "300",
        "10",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD}",
      ]
    volumes:
      - redis-data-chat-app:/data

volumes:
  postgres-data-auth-service-chat-app:
  postgres-data-user-service-chat-app:
  postgres-data-friend-service-chat-app:
  postgres-data-chat-service-chat-app:
  postgres-data-notify-service-chat-app:
  redis-data-chat-app:
