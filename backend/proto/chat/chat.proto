syntax = "proto3";

package proto;

import "buf/validate/validate.proto";

option go_package = "internal/gen-proto/chat;chat_proto";

service ChatService {
    rpc CreatePrivateConversation(CreatePrivateConversationRequest) returns (CreatePrivateConversationResponse);
    rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
    rpc GetConversationMembers(GetConversationMembersRequest) returns (GetConversationMembersResponse);
    rpc GetConversationType(GetConversationTypeRequest) returns (GetConversationTypeResponse);
    rpc GetGroupInfo(GetGroupInfoRequest) returns (GetGroupInfoResponse);
}

message GetGroupInfoRequest {
    string conversation_id = 1 [
        (buf.validate.field).required = true,
        (buf.validate.field).string.uuid = true
    ];
}

message GetGroupInfoResponse {
    string group_name = 1;
    string group_avatar_url = 2;
}

message GetConversationTypeRequest {
    string conversation_id = 1 [
        (buf.validate.field).required = true,
        (buf.validate.field).string.uuid = true
    ];
}

message GetConversationTypeResponse {
    string conversation_type = 1;
}

message GetConversationMembersRequest {
    string conversation_id = 1 [
        (buf.validate.field).required = true,
        (buf.validate.field).string.uuid = true
    ];

    int32 user_id = 2 [
        (buf.validate.field).required = true,
        (buf.validate.field).int32.gt = 0
    ];
}

message GetConversationMembersResponse {
    repeated int32 user_ids = 1;
}

message SendMessageRequest {
    string conversation_id = 1 [
        (buf.validate.field).required = true,
        (buf.validate.field).string.uuid = true
    ];

    int32 sender_id = 2 [
        (buf.validate.field).required = true,
        (buf.validate.field).int32.gt = 0
    ];

    string device_id = 3 [
        (buf.validate.field).required = true,
        (buf.validate.field).string.uuid = true
    ];

    string content = 4 [
        (buf.validate.field).required = true,
        (buf.validate.field).string.min_len = 0
    ];
}

message SendMessageResponse {
    bool success = 1;
}

message CreatePrivateConversationRequest {
    int32 user_id_1 = 1 [
        (buf.validate.field).required = true,
        (buf.validate.field).int32.gt = 0
    ];

    int32 user_id_2 = 2 [
        (buf.validate.field).required = true,
        (buf.validate.field).int32.gt = 0
    ];
}

message CreatePrivateConversationResponse {
    bool success = 1;
}

