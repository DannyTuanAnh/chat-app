version: "2"
sql:
  # User Service
  - engine: "postgresql"
    queries: "./internal/db/queries/user"
    schema: "./internal/db/migrations/user"
    gen:
      go:
        package: "sqlc"
        out: "./internal/db/sqlc/user"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "date"
            go_type: "time.Time"

  # Auth Service
  - engine: "postgresql"
    queries: "./internal/db/queries/auth"
    schema: "./internal/db/migrations/auth"
    gen:
      go:
        package: "sqlc"
        out: "./internal/db/sqlc/auth"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "date"
            go_type: "time.Time"

  # Friend Service
  - engine: "postgresql"
    queries: "./internal/db/queries/friend"
    schema: "./internal/db/migrations/friend"
    gen:
      go:
        package: "sqlc"
        out: "./internal/db/sqlc/friend"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "date"
            go_type: "time.Time"

  # Chat Service
  - engine: "postgresql"
    queries: "./internal/db/queries/chat"
    schema: "./internal/db/migrations/chat"
    gen:
      go:
        package: "sqlc"
        out: "./internal/db/sqlc/chat"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "date"
            go_type: "time.Time"

